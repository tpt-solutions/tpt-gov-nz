# cargo-deny configuration for the Rust workspace.
# Run: cargo deny check advisories licenses

[advisories]
version = 2
# Accepted, with reasons. All three come from `opa-wasm` (the gateway's OPA evaluator) and are
# "unmaintained" notices, not known vulnerabilities. There is no safe upgrade in the current
# opa-wasm release. Remove these entries when opa-wasm is upgraded or replaced.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; pulled in by opa-wasm; no safe upgrade" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; pulled in by opa-wasm; no safe upgrade" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is archived; pulled in by serde_yaml via opa-wasm" },
]

[licenses]
version = 2
# Permissive licenses only. Anything copyleft or unknown fails the check and
# needs an explicit, reviewed entry here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
