version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The gateway's OTLP exporter stack (opentelemetry-otlp, tracing-opentelemetry)
      # is pinned to the 0.28 family. opentelemetry_sdk 0.33 pulls in a second
      # opentelemetry 0.33, which fails to compile against it.
      - dependency-name: "opentelemetry_sdk"
        versions: [">=0.29"]
      - dependency-name: "opentelemetry"
        versions: [">=0.29"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) port and drops the JS API that
      # Next.js 15 needs (ts.sys, ts.findConfigFile), which breaks `next lint`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
